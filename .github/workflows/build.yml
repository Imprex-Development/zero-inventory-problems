name: Build

on:
  push:
    branches:
      - '**' 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set BUILD_VERSION
      run: echo "BUILD_VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))-b$GITHUB_RUN_NUMBER" >> $GITHUB_ENV
    - name: Restore Maven cache
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ secrets.CACHE_VERSION }}-${{ hashFiles('./.github/workflows/buildtools.sh') }}
        restore-keys: |
          ${{ runner.os }}-maven-${{ secrets.CACHE_VERSION }}-
    - name: Set up JDK 17/25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: |
          17
          21
          25
    - name: Run BuildTools
      run: |
        bash ./.github/workflows/buildtools.sh
    - name: Build
      run: |
        mvn clean package -pl zip-plugin --batch-mode --also-make -Drevision=$BUILD_VERSION
        mv zip-plugin/target/zip-*.jar ./
    - name: Save Maven cache
      if: always() && steps.cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.m2/repository
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zero-inventory-problems-plugin
        path: ./zip-*.jar
